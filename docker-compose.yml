version: "3.9"

services:
  neo4j:
    image: neo4j:5.12-community
    container_name: truthnet_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/truthnet123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: truthnet_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - AI_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://backend:3000
      - CUDA_VISIBLE_DEVICES=""
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthnet_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=truthnet123
      - AI_SERVICE_URL=http://ai_service:8000
    depends_on:
      - neo4j
      - ai_service

volumes:
  neo4j_data:
  neo4j_logs:
